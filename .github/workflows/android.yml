name: Android APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kivy and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libmtdev1 xclip
          python -m pip install --upgrade pip
          pip install -r requirements.txt kivy==2.3.1
      - name: Render every screen (phone, small phone, tablet)
        run: |
          python android/sync_core.py
          cd android
          xvfb-run -a -s "-screen 0 2600x2600x24" python tools/ui_snapshot.py ../ui-shots/phone 412 892 2
          xvfb-run -a -s "-screen 0 2600x2600x24" python tools/ui_snapshot.py ../ui-shots/small 360 640 2
          xvfb-run -a -s "-screen 0 2600x2600x24" python tools/ui_snapshot.py ../ui-shots/tablet 1280 800 1.5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots

  apk:
    needs: [tests, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake autopoint libtool pkg-config cmake ninja-build \
            build-essential ccache zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            libltdl-dev lld patch

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0 cython==3.0.12 setuptools wheel

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-global-${{ runner.os }}-

      - name: Sync shared engine into the app
        run: python android/sync_core.py

      - name: Build debug APK
        working-directory: android
        run: yes | buildozer -v android debug 2>&1 | tee build.log; exit ${PIPESTATUS[1]}

      - name: Verify APK
        working-directory: android
        run: |
          ls -la bin
          APK=$(ls bin/*.apk | head -n 1)
          test -s "$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/|lib/armeabi-v7a/" | head
          unzip -l "$APK" | grep -c "\.so$"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phoneintel-apk
          path: android/bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: android/build.log
